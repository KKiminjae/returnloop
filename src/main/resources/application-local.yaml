spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:returnloop}?allowPublicKeyRetrieval=true&sslMode=DISABLED&connectionTimeZone=UTC
    username: ${MYSQL_USER:returnloop}
    password: ${MYSQL_PASSWORD:returnloop_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
